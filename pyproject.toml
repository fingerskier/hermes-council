[project]
name = "hermes-council"
version = "0.1.0"
description = "Multi-seat deliberation engine plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fingerskier" }]
dependencies = [
  "pyyaml>=6.0",
]

[project.entry-points."hermes_agent.plugins"]
council = "hermes_council:register"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "skills*"]
